[project]
name = "regtech"
version = "0.1.0"
description = "Downloads Swedish financial law, splits it into sections and extracts its citations."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.142.2",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "pymupdf>=1.28.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
regtech = "regtech.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
